<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="base-url" content="{{ site.baseurl }}">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/png" href="{{ '/assets/img/nDNA_logo.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
  <link href="https://cdn.jsdelivr.net/npm/lightbox2@2/dist/css/lightbox.min.css" rel="stylesheet">

  <!-- MathJax for LaTeX rendering -->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<style>
  /* Improve math readability and mobile responsiveness */
  .MathJax { 
    font-size: 1.1em !important;
    line-height: 1.5 !important;
  }
  /* Add horizontal scroll for long equations on small screens */
  .MathJax_Display {
    overflow-x: auto;
    overflow-y: hidden;
  }
</style>

<!-- Advanced MathJax Configuration -->
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true,
      packages: {'[+]': ['ams', 'textmacros']},
      tags: 'ams' // Use AMS-style equation numbering
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      ignoreHtmlClass: 'tex2jax_ignore',
      processHtmlClass: 'tex2jax_process'
    },
    startup: {
      // This function runs when MathJax is ready to start
      ready: function() {
        console.log('MathJax is starting up');
        // The default startup sequence runs automatically
        MathJax.startup.defaultReady();
        // A promise that resolves when the initial typesetting is complete
        MathJax.startup.promise.then(function() {
          console.log('MathJax initial typeset complete');
        }).catch(function(err) {
          console.error('MathJax error:', err);
        });
      }
    }
  };
</script>

<!-- Load the MathJax library -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>

</head>
<body>

  <!-- LEFT COLUMN: Logo + Tabs -->
  <div class="left-column">
    <div class="logo-container">
      <img src="{{ '/assets/img/ndna_logo.jpg' | relative_url }}" alt="nDNA Logo">
    </div>
    <div class="side-menu" id="leftTabs">
      <div class="side-tab active" onclick="switchView('LLM')">LLM</div>
      <div class="side-tab" onclick="switchView('MFM')">MFM</div>
      <div class="side-tab" onclick="switchView('T2I')">T2I</div>
      <div class="side-tab" onclick="switchView('Diffusion')">Diffusion LM</div>
      <div class="side-tab" onclick="switchView('EFM')">EFM</div>
    </div>
    <div class="ndna-cover">
      <img src="{{ site.cdn_url }}/assets/images/nDNA_BOOK_cover.jpg" alt="nDNA" class="ndna-cover-image">
    </div>
  </div>

  <!-- RIGHT CONTENT -->
  <div class="page-wrapper">
    
    <!-- TOP MENU -->
    <div class="navbar">
      <div class="navbar-content">
        <div id="topMenu"></div>
        <div class="pragya-logo">
          <a href="https://pragyaai.github.io/" target="_blank">
            <img src="{{ '/assets/img/pragya.png' | relative_url }}" alt="Pragya Logo">
          </a>
        </div>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container">
      <div class="main-text">
        {{ content }}
      </div>
    </div>

    <footer>
      © Copyright {{ 'now' | date: "%Y" }} nDNA. Hosted with ❤️.
    </footer>
  </div>

  <script src="{{ '/assets/js/ndna.js' | relative_url }}"></script>
  
  <!-- Lightbox HTML -->
  <div id="galleryLightbox" class="lightbox">
    <span class="close-lightbox">&times;</span>
    <img class="lightbox-content" id="expandedGif" alt="Expanded view">
    <div id="lightboxCaption" class="lightbox-caption"></div>
  </div>
  <script>
    // DEBUG: Check if script runs and images are found
    document.addEventListener('DOMContentLoaded', function() {
      const imgs = document.querySelectorAll('.gallery-img');
      console.log('Lightbox script loaded. Found gallery images:', imgs.length);
      imgs.forEach(img => img.style.border = '2px solid red'); // Visual debug
    });
  </script>
  <script>
    // Lightbox functionality
    document.addEventListener('DOMContentLoaded', function() {
      const lightbox = document.getElementById('galleryLightbox');
      const closeBtn = document.querySelector('.close-lightbox');
      const lightboxImg = document.getElementById('expandedGif');
      const lightboxCaption = document.getElementById('lightboxCaption');
      
      // Add click event to all gallery images
      document.querySelectorAll('.gallery-img').forEach(img => {
        img.addEventListener('click', function() {
          lightboxImg.src = this.src;
          lightboxCaption.textContent = this.alt;
          
          // Show the lightbox
          lightbox.style.display = 'block';
          document.body.style.overflow = 'hidden';
          
          // Force reflow to enable animation
          void lightbox.offsetWidth;
          lightbox.classList.add('show');
        });
      });
      
      // Close lightbox
      function closeLightbox() {
        lightbox.classList.remove('show');
        setTimeout(() => {
          lightbox.style.display = 'none';
          document.body.style.overflow = 'auto';
        }, 300); // Match this with CSS transition time
      }
      
      closeBtn.onclick = closeLightbox;
      
      // Close when clicking outside the image
      lightbox.onclick = function(e) {
        if (e.target === lightbox) {
          closeLightbox();
        }
      };
      
      // Close with ESC key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && lightbox.classList.contains('show')) {
          closeLightbox();
        }
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/lightbox2@2/dist/js/lightbox.min.js"></script>
</body>
</html>
