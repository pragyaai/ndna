<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="base-url" content="{{ site.baseurl }}">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/png" href="{{ '/assets/img/nDNA_logo.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/ndna.css' | relative_url }}">
  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true,
        packages: {'[+]': ['base', 'ams', 'textmacros']},
        tags: 'ams',
        autoload: {}
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process'
      },
      startup: {
        ready: function() {
          console.log('MathJax is starting up');
          MathJax.startup.defaultReady();
          MathJax.startup.promise.then(function() {
            console.log('MathJax initial typeset complete');
          }).catch(function(err) {
            console.error('MathJax error:', err);
          });
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
  <style>
    .MathJax { 
      font-size: 1.1em !important;
      line-height: 1.5 !important;
    }
    .MathJax_Display {
      overflow-x: auto;
      overflow-y: hidden;
    }
  </style>
  <script>
    // Force MathJax to re-render when page loads
    document.addEventListener('DOMContentLoaded', function() {
      if (window.MathJax) {
        console.log('DOM content loaded, re-rendering MathJax');
        MathJax.typesetPromise().catch(function(err) {
          console.error('MathJax typeset error:', err);
        });
      }
    });
  </script>
  {% feed_meta %}
  {% seo %}
</head>
<body>

  <!-- LEFT COLUMN: Logo + Tabs -->
  <div class="left-column">
    <div class="logo-container">
      <img src="{{ '/assets/img/ndna_logo_v5.png' | relative_url }}" alt="nDNA Logo">
    </div>
    <div class="side-menu" id="leftTabs">
      <div class="side-tab active" onclick="switchView('LLM')">LLM</div>
      <div class="side-tab" onclick="switchView('MFM')">MFM</div>
      <div class="side-tab" onclick="switchView('T2I')">T2I</div>
      <div class="side-tab" onclick="switchView('Diffusion')">Diffusion LM</div>
      <div class="side-tab" onclick="switchView('EFM')">EFM</div>
    </div>
  </div>

  <!-- RIGHT CONTENT -->
  <div class="page-wrapper">
    
    <!-- TOP MENU -->
    <div class="navbar">
      <div class="navbar-content">
        <div id="topMenu" style="display: flex; flex-wrap: wrap; align-items: center; flex: 1; min-width: 0;"></div>
        <div class="pragya-logo">
          <a href="https://pragyaai.github.io/" target="_blank">
            <img src="{{ '/assets/img/pragya.png' | relative_url }}" alt="Pragya Logo">
          </a>
        </div>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="container">
      <div class="main-text" style="flex: 1;">
        {% if page.title %}
          <h1>{{ page.title }}</h1>
        {% endif %}
        {{ content }}
      </div>
    </div>

    <footer>
      © Copyright {{ 'now' | date: "%Y" }} nDNA. Hosted with ❤️.
    </footer>
  </div>

  <script src="{{ '/assets/js/ndna.js' | relative_url }}"></script>
</body>
</html>
