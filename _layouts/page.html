<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="base-url" content="{{ site.baseurl }}">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <link rel="icon" type="image/png" href="{{ '/assets/img/nDNA_logo.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/sidebar-enhanced.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/threat-cards.css' | relative_url }}">
  {% if page.css_files %}
    {% for css_file in page.css_files %}
      <link rel="stylesheet" href="{{ '/assets/css/' | append: css_file | relative_url }}">
    {% endfor %}
  {% endif %}
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
  /* Improve math readability and mobile responsiveness */
  .MathJax { 
    font-size: 1.1em !important;
    line-height: 1.5 !important;
  }
  /* Add horizontal scroll for long equations on small screens */
  .MathJax_Display {
    overflow-x: auto;
    overflow-y: hidden;
  }
</style>

<!-- Advanced MathJax Configuration -->
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true,
      packages: {'[+]': ['ams', 'textmacros']},
      tags: 'ams' // Use AMS-style equation numbering
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      ignoreHtmlClass: 'tex2jax_ignore',
      processHtmlClass: 'tex2jax_process'
    },
    startup: {
      // This function runs when MathJax is ready to start
      ready: function() {
        console.log('MathJax is starting up');
        // The default startup sequence runs automatically
        MathJax.startup.defaultReady();
        // A promise that resolves when the initial typesetting is complete
        MathJax.startup.promise.then(function() {
          console.log('MathJax initial typeset complete');
        }).catch(function(err) {
          console.error('MathJax error:', err);
        });
      }
    }
  };
</script>

<!-- Load the MathJax library -->
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
  {% feed_meta %}
  {% seo %}
</head>
<body>

  <!-- TOP HEADER -->
  <div class="navbar">
    <div class="navbar-left">
      <button class="sidebar-trigger" style="display: none;" onclick="toggleSidebar()" title="Toggle Sidebar (Ctrl+B)">
        <i class="fas fa-bars"></i>
      </button>
      <div class="navbar-logo">
        <img src="{{ '/assets/img/ndna_logo.jpg' | relative_url }}" alt="nDNA Logo">
      </div>
    </div>
    <div class="breadcrumb" id="breadcrumb">
      <!-- Breadcrumb will be populated by JavaScript -->
    </div>
    <div class="pragya-logo">
      <a href="https://pragyaai.github.io/" target="_blank">
        <img src="{{ '/assets/img/pragya.png' | relative_url }}" alt="Pragya Logo">
      </a>
    </div>
  </div>

    <!-- LEFT SIDEBAR -->
    <div class="sidebar" id="sidebar" data-state="expanded" data-collapsible="icon">
      <div class="sidebar-content">
        <!-- Main Category Navigation -->
        <div class="sidebar-group">
          <div class="sidebar-group-label">Models</div>
          <div class="sidebar-menu" id="leftTabs">
            <div class="sidebar-menu-item">
              <button class="sidebar-menu-button active collapsible-trigger" onclick="switchView('LLM')" data-view="LLM" data-tooltip="Large Language Models">
                <i class="fas fa-robot sidebar-icon"></i>
                <span class="sidebar-label">LLM</span>
                <i class="fas fa-chevron-down sidebar-chevron"></i>
              </button>
              <div class="sidebar-submenu" id="LLM-submenu">
                <!-- LLM submenu items will be populated by JavaScript -->
              </div>
            </div>
            <div class="sidebar-menu-item">
              <button class="sidebar-menu-button collapsible-trigger" onclick="switchView('MFM')" data-view="MFM" data-tooltip="Multimodal Foundation Models">
                <i class="fas fa-layer-group sidebar-icon"></i>
                <span class="sidebar-label">MFM</span>
                <i class="fas fa-chevron-down sidebar-chevron"></i>
              </button>
              <div class="sidebar-submenu" id="MFM-submenu">
                <!-- MFM submenu items will be populated by JavaScript -->
              </div>
            </div>
            <div class="sidebar-menu-item">
              <button class="sidebar-menu-button collapsible-trigger" onclick="switchView('T2I')" data-view="T2I" data-tooltip="Text-to-Image">
                <i class="fas fa-image sidebar-icon"></i>
                <span class="sidebar-label">T2I</span>
                <i class="fas fa-chevron-down sidebar-chevron"></i>
              </button>
              <div class="sidebar-submenu" id="T2I-submenu">
                <!-- T2I submenu items will be populated by JavaScript -->
              </div>
            </div>
            <div class="sidebar-menu-item">
              <button class="sidebar-menu-button collapsible-trigger" onclick="switchView('Diffusion')" data-view="Diffusion" data-tooltip="Diffusion Language Models">
                <i class="fas fa-water sidebar-icon"></i>
                <span class="sidebar-label">Diffusion LM</span>
                <i class="fas fa-chevron-down sidebar-chevron"></i>
              </button>
              <div class="sidebar-submenu" id="Diffusion-submenu">
                <!-- Diffusion submenu items will be populated by JavaScript -->
              </div>
            </div>
            <div class="sidebar-menu-item">
              <button class="sidebar-menu-button collapsible-trigger" onclick="switchView('EFM')" data-view="EFM" data-tooltip="Embodied Foundation Models">
                <i class="fas fa-cogs sidebar-icon"></i>
                <span class="sidebar-label">EFM</span>
                <i class="fas fa-chevron-down sidebar-chevron"></i>
              </button>
              <div class="sidebar-submenu" id="EFM-submenu">
                <!-- EFM submenu items will be populated by JavaScript -->
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <div class="sidebar-footer">
        <a class="sidebar-book-link" href="{{ site.baseurl }}/assets/nDNA_BOOK.pdf" target="_blank">
          <img src="{{ site.cdn_url }}/assets/images/nDNA_BOOK_cover.jpg" alt="nDNA" class="sidebar-book-image">
        </a>
      </div>
      
      <!-- Sidebar Rail for toggling -->
      <div class="sidebar-rail" onclick="toggleSidebar()"></div>
    </div>

    <!-- RIGHT CONTENT -->
    <div class="page-wrapper">
      <!-- MAIN CONTENT -->
      <div class="container">
        <div class="main-text" style="flex: 1;">
          {% unless page.skip_title %}
            {% if page.title %}
              <h1>{{ page.title }}</h1>
            {% endif %}
          {% endunless %}
          {{ content }}
        </div>
      </div>

        <footer>
          © Copyright {{ 'now' | date: "%Y" }} nDNA.
        </footer>
    </div>
  </div>

  <script src="{{ '/assets/js/ndna.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/sidebar-enhanced.js' | relative_url }}"></script>
</body>
</html>
