  <!-- This script controls the opening and closing of your modal -->
  <script>
    const overlay = document.getElementById('overlay');
    const closeBtn = document.getElementById('closeBtn');
    // The selector now finds the image link because we added the "open-btn" class to it
    const openBtn = document.querySelector('.open-btn');
  
    openBtn.addEventListener('click', (e) => {
      // This is IMPORTANT: It stops the link from opening a new tab.
      e.preventDefault(); 
      // This opens the modal popup.
      overlay.style.display = 'flex';
    });
    
    closeBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
    });
  
    overlay.addEventListener('click', (e) => {
      // This closes the modal if you click on the dark background area
      if (e.target === overlay) {
        overlay.style.display = 'none';
      }
    });
  </script>
