concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true
name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_layouts/**"
      - "_pages/**"
      - "**.html"
      - "**.js"
      - "**.css"
      - "**/*.md"
      - "_config.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_layouts/**"
      - "_pages/**"
      - "**.html"
      - "**.js"
      - "**.css"
      - "**/*.md"
      - "_config.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          # Shallow clone to save space
          fetch-depth: 1
      
      - name: Free up disk space 🧹
        run: |
          # Check initial disk space
          df -h
          # Remove unnecessary packages and clean apt cache
          sudo apt-get clean || true
          sudo apt-get autoremove -y || true
          # Remove large directories we don't need
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          # Check disk space after cleanup
          df -h
      
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: false
      
      - name: Cache Bundler dependencies 📦
        uses: actions/cache@v4
        with:
          path: |
            vendor/bundle
            ~/.bundle
          key: ${{ runner.os }}-bundler-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundler-
        continue-on-error: true
      
      - name: Install dependencies 🔧
        run: |
          bundle config path vendor/bundle
          bundle config set --local deployment 'true'
          bundle config set --local without 'development test'
          bundle install --jobs 4 --retry 3
      
      - name: Build Jekyll site 🔧
        run: |
          # Set Jekyll environment
          export JEKYLL_ENV=production
          # Build with optimized settings
          bundle exec jekyll build --verbose
          # Clean up any temporary files after build
          bundle exec jekyll clean
        env:
          JEKYLL_ENV: production
          BUNDLE_DEPLOYMENT: true
      
      - name: Check disk space after build 📊
        run: |
          df -h
          du -sh _site/
      
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          # Clean the target branch to avoid accumulating files
          clean: true
          # Only deploy necessary files
          clean-exclude: |
            .nojekyll
            CNAME
